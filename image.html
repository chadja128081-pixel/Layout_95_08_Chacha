<!DOCTYPE html>
<html>
    <head>
        <title>Image HTML dan CSS</title>
        <link rel="stylesheet" href="image.css">
    </head>
    <body>
        <!-- Cara menambahkan Gambar dengan ukuran normal, format gambar : .jpg/.jpeg/.png/-->
         <p> Ini adalah Gambar dengan ukuran Normal</p>
         <img src="images.jpg" alt="Pou">

         <!-- Cara mengubah ukuran pada gambar -->
          <p>Ini adalah gambar yang sudah diberi ukuran</p>
          <img src="images.jpg" alt="Pou" class="ukuran">

          <!-- Cara memberikan lengkungan pada Gambar -->
           <p>Ini adalah gambar yang diberi lengkungan</p>
           <img src="images.jpg" alt="Pou" class="lengkungan">

           <!-- Cara menggabungkan gambar dan teks -->
            <div class="kelompok">
                <img src="images.jpg" alt="Pou">
                <p>Gambar Pou</p>
            </div>
            <!-- Cara memberi efek Hover -->
             <div class="efek">
                <img src="images.jpg" alt="Pou">
                <p>Ini contoh Hover</p>
             </div>
             <!-- Ini Font External, format font: otf/ttf -->
              <p class="External"> Ini Font External</p>
    <body>
</html>
